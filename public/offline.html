<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f1e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1c15" media="(prefers-color-scheme: dark)">
<title>Mất kết nối · Dream's Garden</title>
<style>
  body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#f5f1e6;color:#17241c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px;box-sizing:border-box;text-align:center}
  img{width:72px;height:72px;margin-bottom:20px}
  h1{font-family:Georgia,serif;color:#2f5d3a;font-size:26px;margin:0 0 8px}
  p{color:#4e5e52;font-size:15px;line-height:1.5;margin:0 0 24px;max-width:320px}
  button{min-height:48px;padding:0 28px;border:0;border-radius:999px;background:#2f5d3a;color:#f8f5ec;font-weight:600;font-size:15px}
  @media (prefers-color-scheme: dark){
    body{background:#0e1c15;color:#f2ecdd}
    h1{color:#cde59a}
    p{color:#a7b6a9}
    button{background:#cde59a;color:#0e1c15}
  }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Đang ngoại tuyến</h1>
  <p>Không có kết nối mạng. Nhật ký sinh trưởng sẽ hiển thị lại khi thiết bị có mạng.</p>
  <button onclick="location.reload()">Thử lại</button>
</main>
</body>
</html>
